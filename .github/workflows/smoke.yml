name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python smoke checks
        run: |
          python - <<'PY'
          import compileall
          import importlib

          if not compileall.compile_dir(".", quiet=1):
              raise SystemExit("Python compile check failed")

          for module_name in (
              "compat_regex",
              "stable_random",
              "dedupe_core",
              "compose",
              "dedupe",
              "dsl_core",
          ):
              importlib.import_module(module_name)

          print("Python smoke checks passed.")
          PY
